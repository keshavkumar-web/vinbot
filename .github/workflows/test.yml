name: Vinbot Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-knowledge-base:
    name: Generate knowledge_db.pkl
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate knowledge_db.pkl
        run: python ingest.py

      - name: Verify knowledge_db.pkl was produced
        run: |
          test -s knowledge_db.pkl || { echo "::error::backend/knowledge_db.pkl is missing or empty after ingest.py"; exit 1; }
          python -c "
          import pickle
          with open('knowledge_db.pkl', 'rb') as f:
              db = pickle.load(f)
          print(f'knowledge_db.pkl: {len(db)} chunks')
          assert len(db) > 0, 'knowledge_db.pkl has zero chunks'
          assert all('embedding' in item and 'text' in item and 'source' in item for item in db), \
              'a chunk is missing source/text/embedding'
          "

      - name: Upload knowledge_db.pkl artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-db
          path: backend/knowledge_db.pkl
          retention-days: 1

  unit-and-integration:
    name: Unit + Integration Tests (pytest)
    runs-on: ubuntu-latest
    needs: build-knowledge-base

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Download knowledge_db.pkl artifact
        uses: actions/download-artifact@v4
        with:
          name: knowledge-db
          path: backend

      - name: Run pytest
        run: pytest -v

      - name: Generate dashboard
        run: python tests/generate_dashboard.py

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/
          retention-days: 30

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build-knowledge-base, unit-and-integration]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download knowledge_db.pkl artifact
        uses: actions/download-artifact@v4
        with:
          name: knowledge-db
          path: backend

      - name: Run smoke tests
        run: |
          python tests/smoke/smoke.py --start-server --port 8000

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke-test-report.md
          retention-days: 30

  postman:
    name: API Integration Tests (Newman)
    runs-on: ubuntu-latest
    needs: [build-knowledge-base, unit-and-integration]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend runtime dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download knowledge_db.pkl artifact
        uses: actions/download-artifact@v4
        with:
          name: knowledge-db
          path: backend

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "Backend did not become healthy in time"
          cat uvicorn.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        working-directory: postman
        run: npm install

      - name: Run Newman tests
        working-directory: postman
        run: npm run test:local

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          retention-days: 30
