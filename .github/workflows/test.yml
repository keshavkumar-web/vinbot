name: Vinbot Test Suite

# Runs the complete testing framework added in Phase 3 (backend/tests/,
# postman/) and uploads every generated report as a build artifact.
#
# Designed to be CI/CD-ready without requiring any application change: it
# only installs dependencies and runs the same commands documented in
# backend/tests/README.md and postman/README.md. The `smoke` and `postman`
# jobs need a real OPENAI_API_KEY GitHub Actions secret (they start the real
# app and make real OpenAI calls); they are skipped automatically if that
# secret isn't configured, so the workflow still runs usefully without it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  unit-and-integration:
    name: Unit + Integration Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest (unit + integration — auto-generates JUnit XML, HTML, coverage)
        run: pytest -v

      - name: Regenerate Test Execution Dashboard
        run: python tests/generate_dashboard.py

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/
          retention-days: 30

  smoke:
    name: Smoke Tests (real running instance)
    runs-on: ubuntu-latest
    needs: unit-and-integration
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests (starts and stops the server itself)
        run: python tests/smoke/smoke.py --start-server --port 8000

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke-test-report.md
          retention-days: 30

  postman:
    name: API Integration Tests (Newman)
    runs-on: ubuntu-latest
    needs: unit-and-integration
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend runtime dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the backend in the background
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "Backend did not become healthy in time"; cat uvicorn.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        working-directory: postman
        run: npm install

      - name: Run the Postman collection with Newman
        working-directory: postman
        run: npm run test:local

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          retention-days: 30
