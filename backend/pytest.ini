[pytest]
# Run from backend/ (the existing project convention — see README.md). All
# report paths below are relative to this directory and resolve to the
# project-level reports/ folder (Vinbot/reports/), shared with Newman/smoke
# output so every test layer's artifacts live in one place.
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: fast, fully-mocked unit tests (no network, no real OpenAI calls)
    integration: exercises the real FastAPI app / SQLite / pickle store together
    slow: reads the real shipped knowledge_db.pkl / uhbvn_tables.db (skipped if absent)

addopts =
    -ra
    --strict-markers
    --junitxml=../reports/junit.xml
    --html=../reports/pytest-report.html --self-contained-html
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:../reports/coverage.xml
    --cov-report=html:../reports/coverage-html
