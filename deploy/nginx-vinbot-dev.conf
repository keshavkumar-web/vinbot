# Nginx site for dev-vinbot.vinbox.in (Vinbot — DEV)
# Serves the built Vue frontend and reverse-proxies /api to Uvicorn (127.0.0.1:8010).
# Place at /etc/nginx/sites-available/vinbot-dev and symlink into sites-enabled.

server {
    listen 80;
    server_name dev-vinbot.vinbox.in;

    root /opt/vinbot-dev/frontend/dist;
    index index.html;

    # SPA routing: serve built assets, fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + Server-Sent Events streaming -> Uvicorn.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for token-by-token SSE streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    client_max_body_size 5m;
}
