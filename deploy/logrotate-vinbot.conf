# logrotate configuration for Vinbot's application log.
# Install at /etc/logrotate.d/vinbot on the deployment host.
#
# Why this exists ALONGSIDE app/logger.py's own RotatingFileHandler, not
# instead of it: RotatingFileHandler rotates app.log -> app.log.1 .. app.log.10
# by SIZE (10 MB), entirely inside the running process, with no awareness of
# calendar time. This logrotate policy is a second, independent safety net —
# it guarantees logs are also rotated/compressed on a daily cadence and
# eventually deleted, even if the size-based rotation above never fires
# because the app logs less than 10 MB/day. Both can coexist safely because
# `copytruncate` never removes the file logger.py has open — it only empties
# it in place, which the open file handle tolerates.

/var/log/vinbot/app.log /var/log/vinbot/app.log.[0-9]* {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    create 0640 vinbot vinbot
}
